name: Build and Release Tarball

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Make build script executable
        run: chmod +x build-tarball.sh

      - name: Build tarball
        run: ./build-tarball.sh

      - name: Get tarball filename
        id: tarball
        run: echo "filename=$(ls -1 node-red-contrib-airtunes-*.tgz | head -1)" >> $GITHUB_OUTPUT

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create release (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" --generate-notes || true

      - name: Upload tarball to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ steps.version.outputs.version }}"
          fi
          TARBALL="${{ steps.tarball.outputs.filename }}"
          gh release upload "$TAG" "$TARBALL" || echo "Upload to $TAG completed"

      - name: Show tarball info
        run: |
          ls -lh node-red-contrib-airtunes-*.tgz
          echo "Tarball ready for download and deployment to Pi 3"
