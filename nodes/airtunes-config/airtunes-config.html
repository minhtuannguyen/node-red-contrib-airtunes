<script type="text/javascript">
    RED.nodes.registerType('airtunes-config', {
        category: 'config',
        defaults: {
            name:   { value: '' },
            host:   { value: '', required: true },
            port:   { value: 7000, required: true, validate: RED.validators.number() },
            volume: { value: 50, validate: RED.validators.number() }
        },
        label: function () {
            return this.name || (this.host + ':' + this.port);
        }
    });
</script>

<script type="text/html" data-template-name="airtunes-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="My HomePod">
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-globe"></i> Host / IP</label>
        <input type="text" id="node-config-input-host" placeholder="192.168.1.100">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
        <input type="number" id="node-config-input-port" placeholder="7000" min="1" max="65535">
    </div>
    <div class="form-row">
        <label for="node-config-input-volume"><i class="fa fa-volume-up"></i> Default Volume (0–100)</label>
        <input type="number" id="node-config-input-volume" placeholder="50" min="0" max="100">
    </div>
</script>
